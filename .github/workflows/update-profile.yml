name: Sync portfolio to GitHub profile

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'scripts/render_profile.py'
      - 'scripts/update_profile.py'
      - '.github/workflows/update-profile.yml'
  workflow_dispatch:
  schedule:
    - cron: '7/10 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh public stats
        id: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_profile.py
          if git diff --quiet -- docs/stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture portfolio for GitHub profile
        if: github.event_name != 'schedule' || steps.stats.outputs.changed == 'true'
        run: python3 scripts/render_profile.py
      - name: Publish changed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/stats.json assets/portfolio-live-*.png
          git add -u assets
          if ! git diff --cached --quiet; then
            git commit -m "Sync GitHub profile with portfolio"
            git push
          fi

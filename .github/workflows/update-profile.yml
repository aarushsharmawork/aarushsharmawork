name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh public stats
        run: python3 scripts/update_profile.py
      - name: Publish changed graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/stats.json assets/overview-live-*.svg
          git add -u assets
          if ! git diff --cached --quiet; then
            git commit -m "Update public profile stats"
            git push
          fi

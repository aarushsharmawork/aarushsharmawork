name: Sync portfolio to GitHub profile

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'scripts/render_profile.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh public stats
        run: python3 scripts/update_profile.py
      - name: Capture portfolio for GitHub profile
        run: python3 scripts/render_profile.py
      - name: Publish changed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/stats.json assets/portfolio-live-*.png
          git add -u assets
          if ! git diff --cached --quiet; then
            git commit -m "Sync GitHub profile with portfolio"
            git push
          fi
